<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>JavaScript Basic</title>
    let i = 0;
    let array = ['가', '나', '다'];

    while (i < array.length){
        alert(i + '번째 출력: '+ array[i]);

        i++;
    }
</head>
<body>
    while반복문<hr>
    <ul>
        <li>불 표현식이 참이면 중괄호 안 문장을 계속 실행</li>
        <li>조건을 거짓으로 만드는 문장이 없으면 무한 반복</li>
    </ul>

    <hr>
    <h3>3. 조건문과 반복문</h3>
    <h5>    1_조건문</h5>
    <h5>    2_반복문</h5>
</body>
</html>
