<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>JavaScript Basic</title>
    <script>
        let date = new Date();
        let hours = date.getHours();

        if (hours < 12){
            alert('오전입니다.');
        } else {
            alert('오후입니다.');
        }
    </script>
</head>
<body>
        if else조건문으로 오전과 오후 구분하기<hr>

    <h3>3. 조건문과 반복문</h3>
    <h5>    1_조건문</h5>
    <h5>    2_반복문</h5>
</body>
</html>
